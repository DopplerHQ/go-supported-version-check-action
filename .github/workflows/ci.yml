name: Continuous Integration

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify_build:
    runs-on: ubuntu-latest
    name: Verify build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Check for uncommitted build output
        run: |
          # --intent-to-add so that newly generated, untracked files show up in the diff
          git add --intent-to-add .
          if ! git diff --exit-code; then
            echo "::error::Build output differs from what is committed. Run 'pnpm run build' and commit the result."
            exit 1
          fi
  test-stable-go-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Stable Go
        id: install-stable-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
      - name: Go Supported Version (any-supported)
        uses: ./
        with:
          go-version: ${{steps.install-stable-go.outputs.go-version}}
          version-requirement: any-supported
      - name: Go Supported Version (any-latest-supported)
        uses: ./
        with:
          go-version: ${{steps.install-stable-go.outputs.go-version}}
          version-requirement: any-latest-supported
      - name: Go Supported Version (latest-supported)
        uses: ./
        with:
          go-version: ${{steps.install-stable-go.outputs.go-version}}
          version-requirement: latest-supported
  test-oldstable-go-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Old-Stable Go
        id: install-oldstable-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'oldstable'
      - name: Go Supported Version (any-supported)
        uses: ./
        with:
          go-version: ${{steps.install-oldstable-go.outputs.go-version}}
          version-requirement: any-supported
      - name: Go Supported Version (any-latest-supported)
        uses: ./
        with:
          go-version: ${{steps.install-oldstable-go.outputs.go-version}}
          version-requirement: any-latest-supported
      - name: Go Supported Version (latest-supported)
        id: go-supported-version-oldstable
        continue-on-error: true
        uses: ./
        with:
          go-version: ${{steps.install-oldstable-go.outputs.go-version}}
          version-requirement: latest-supported
      - name: Invert result
        if: always()
        run: |
          if [ "${{ steps.go-supported-version-oldstable.outcome }}" == "success" ]; then
            echo "The 'Go Supported Version' check unexpectedly succeeded."
            exit 1
          else
            echo "The 'Go Supported Version' check failed as expected."
            exit 0
          fi
  test-static-old-go-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Go Supported Version (any-supported)
        id: go-supported-version-static-any
        continue-on-error: true
        uses: ./
        with:
          go-version: 1.21.13
          version-requirement: any-supported
      - name: Go Supported Version (any-latest-supported)
        id: go-supported-version-static-any-latest
        continue-on-error: true
        uses: ./
        with:
          go-version: 1.21.13
          version-requirement: any-latest-supported
      - name: Go Supported Version (latest-supported)
        id: go-supported-version-static-latest
        continue-on-error: true
        uses: ./
        with:
          go-version: 1.21.13
          version-requirement: latest-supported
      - name: Invert result
        if: always()
        run: |
          if [ "${{ steps.go-supported-version-static-any.outcome }}" == "success" ] ||
            [ "${{ steps.go-supported-version-static-any-latest.outcome }}" == "success" ] ||
            [ "${{ steps.go-supported-version-static-latest.outcome }}" == "success" ]; then
            echo "The 'Go Supported Version' check unexpectedly succeeded."
            exit 1
          else
            echo "The 'Go Supported Version' check failed as expected."
            exit 0
          fi